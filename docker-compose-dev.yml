version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: next-app
    working_dir: /app

    ports:	
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    env_file:
      - .env

    stdin_open: true
    tty: true

    networks:
      - app-network

networks:
  app-network:
    driver: bridge