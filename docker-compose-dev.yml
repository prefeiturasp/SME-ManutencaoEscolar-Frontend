version: "3.9"
 
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: next-app
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
 
    environment:
      NODE_ENV: development
 
    env_file:
      - .env
    networks:
      - app-network
 
networks:
  app-network:
    driver: bridge